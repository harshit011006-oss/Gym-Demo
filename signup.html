<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up | RedRocks Fitness</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main>

        <section class="contact-form-wrapper">

            <div class="form-header">

                <p class="section-label">
                    REDROCKS FITNESS
                </p>

                <h3>
                    CREATE ACCOUNT.
                </h3>

            </div>


            <form id="signupForm" class="contact-form">

                <div class="form-group">

                    <label for="signupName">
                        FULL NAME
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        EMAIL ADDRESS
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupPhone">
                        PHONE NUMBER
                    </label>

                    <input
                        type="tel"
                        id="signupPhone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button form-submit"
                >
                    CREATE ACCOUNT
                </button>


                <p
                    id="signupStatus"
                    class="form-status"
                    aria-live="polite"
                ></p>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
