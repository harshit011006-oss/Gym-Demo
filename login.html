<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | RedRocks Fitness</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <section class="contact-form-wrapper">

            <div class="form-header">
                <p class="section-label">REDROCKS FITNESS</p>
                <h3>WELCOME BACK.</h3>
            </div>

            <form id="loginForm" class="contact-form">

                <div class="form-group">
                    <label for="loginEmail">
                        EMAIL ADDRESS
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="primary-button form-submit"
                >
                    SIGN IN
                </button>

                <p
                    id="loginStatus"
                    class="form-status"
                    aria-live="polite"
                ></p>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
